name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install game dependencies and PyInstaller
        run: python -m pip install -r "Car Game/requirements.txt" pyinstaller

      - name: Build executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Desktop-Drift
          --add-data "Car Game/Assets;Assets"
          "Car Game/desktop_drift.py"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-Drift-Windows
          path: dist/Desktop-Drift.exe
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/Desktop-Drift.exe --title "Desktop Drift $env:GITHUB_REF_NAME" --generate-notes
